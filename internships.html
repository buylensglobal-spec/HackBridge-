<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internships | HackBridge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container topbar">
        <div class="brand">
          <img class="brand-mark" src="HackBridgeLogo.png" alt="HackBridge logo" />
          <div class="brand-name">HackBridge</div>
        </div>

        <div class="header-actions">
          <a class="secondary-btn" href="signin.html">Sign in</a>
          <a class="primary-btn" href="login.html">Login</a>
          <a class="profile-chip" href="profile.html" aria-label="Open student profile" data-profile-chip hidden>
            <img src="HackBridgeLogo.png" data-profile-image alt="Student profile" />
            <div>
              <strong data-profile-name></strong>
              <span data-profile-email></span>
            </div>
          </a>
        </div>
      </div>

      <nav class="container navbar" aria-label="Main navigation">
        <a class="nav-link" href="index.html" data-page="index.html">Home</a>
        <a class="nav-link" href="hackathons.html" data-page="hackathons.html">Hackathons</a>
        <a class="nav-link active" href="internships.html" data-page="internships.html">Internships</a>
        <a class="nav-link" href="youtube.html" data-page="youtube.html">YouTube</a>
      </nav>
    </header>

    <main class="container page-shell">
      <div class="section-heading">
        <h2>Internship Opportunities</h2>
        <span class="muted">Requirements, roles, and growth paths</span>
      </div>

      <div class="intern-grid" id="internship-list"></div>
      <p class="muted project-empty-state" data-internship-empty hidden>No internships have been published yet.</p>
    </main>

    <footer>
      <div class="container footer-inner">
        <div>© 2026 HackBridge</div>
        <div>Future-focused education for learners & builders</div>
      </div>
    </footer>

    <script type="module" src="script.js"></script>
    <script type="module">
      import { database, get, onValue, ref, set } from './firebase.js';

      const internshipList = document.getElementById('internship-list');
      const emptyState = document.querySelector('[data-internship-empty]');

      const sanitizeFirebaseKey = (value) => String(value || '')
        .trim()
        .replace(/[.#$]/g, '_')
        .replace(/\[/g, '_')
        .replace(/\]/g, '_')
        .replace(/\//g, '_');

      const createInternshipCard = (internship, internshipId) => {
        const title = internship.title || 'Internship opportunity';
        const card = document.createElement('article');
        card.className = 'intern-card';
        card.dataset.databaseInternship = 'true';
        card.dataset.cardName = `${title} at ${internship.company || ''}`;

        const heading = document.createElement('h3');
        heading.textContent = title;
        const badges = document.createElement('div');
        badges.className = 'badge-row';
        [internship.location, internship.duration].filter(Boolean).forEach((value) => {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = value;
          badges.append(badge);
        });

        const description = document.createElement('p');
        description.textContent = internship.description || 'Explore this internship opportunity.';
        const requirements = document.createElement('ul');
        requirements.className = 'list-check';
        (Array.isArray(internship.requirements) ? internship.requirements : []).forEach((requirement) => {
          const item = document.createElement('li');
          item.textContent = requirement;
          requirements.append(item);
        });

        const meta = document.createElement('div');
        meta.className = 'meta-row';
        const company = document.createElement('span');
        company.textContent = internship.company || 'Company';
        const joinButton = document.createElement('button');
        joinButton.className = 'action-btn primary-btn';
        joinButton.type = 'button';
        joinButton.textContent = 'Join';

        const applicationPath = (studentId) => `internships/${internshipId}/applicants/${studentId}`;
        const showJoinedState = (label) => {
          joinButton.textContent = label;
          joinButton.disabled = true;
        };

        const currentStudentId = localStorage.getItem('hackbridge-profile-id');
        if (currentStudentId) {
          get(ref(database, applicationPath(currentStudentId)))
            .then((snapshot) => {
              if (snapshot.exists()) showJoinedState('Previously joined');
            })
            .catch((error) => console.error('Could not check internship application', error));
        }

        joinButton.addEventListener('click', async () => {
          const studentId = localStorage.getItem('hackbridge-profile-id');
          if (!studentId) {
            joinButton.textContent = 'Login to join';
            return;
          }

          try {
            joinButton.textContent = 'Joining...';
            joinButton.disabled = true;
            const existingApplication = await get(ref(database, applicationPath(studentId)));
            if (existingApplication.exists()) {
              showJoinedState('Previously joined');
              return;
            }

            await set(ref(database, applicationPath(studentId)), true);
            showJoinedState('Joined');
          } catch (error) {
            console.error('Could not save internship application', error);
            joinButton.textContent = 'Try again';
            joinButton.disabled = false;
          }
        });
        meta.append(company, joinButton);
        card.append(heading, badges, description, requirements, meta);
        return card;
      };

      onValue(ref(database, 'internships'), (snapshot) => {
        const internships = Object.values(snapshot.val() || {});
        internshipList.querySelectorAll('[data-database-internship]').forEach((card) => card.remove());
        emptyState.hidden = internships.length > 0;
        Object.entries(snapshot.val() || {}).forEach(([internshipId, internship]) => {
          internshipList.append(createInternshipCard(internship, internshipId));
        });
      });
    </script>
  </body>
</html>
